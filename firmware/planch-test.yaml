# PlancH - test bench on an ESP-WROOM-32 without display, keys or LEDs, from the local files.
# Board in planch/test-bench.yaml, logic in planch/core.yaml and components/planch/.
# Wi-Fi is set after flashing, without secrets: from web.esphome.io ("Configure Wi-Fi", Improv serial)
# or from the "PlancH test" hotspot that the board opens while it has no network.

packages:
  board: !include planch/test-bench.yaml

external_components:
  - source: components
    components: [planch]

# Adoption in the ESPHome Device Builder: the configuration imports planch/import-test.yaml from GitHub
dashboard_import:
  package_import_url: github://caccia78/PlancH/firmware/planch/import-test.yaml@main
