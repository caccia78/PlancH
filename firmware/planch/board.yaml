# PlancH - the board (Waveshare ESP32-S3-Zero): pins, display and keys.
# Not compiled on its own: planch.yaml (local files) and planch/import.yaml (from GitHub, for the
# devices adopted in the ESPHome Device Builder) add the source of the "planch" component.
# Menu built automatically by Home Assistant from the devices with the label "PlancH": logic in
# core.yaml and components/planch/menu.h, Home Assistant package in homeassistant/planch.yaml.

substitutions:
  led_pin: GPIO10

esphome:
  name: planch
  friendly_name: PlancH
  name_add_mac_suffix: true   # every panel gets its own name (planch-xxxxxx)
  project:
    name: "caccia78.planch"
    version: "1.0.0"

esp32:
  board: esp32-s3-devkitc-1
  framework:
    type: esp-idf

logger:
  hardware_uart: USB_SERIAL_JTAG   # frees TX/RX (Back button on GPIO 44)

ota:
  - platform: esphome
wifi:
  # Without these two lines the first assembled board kept dropping off the network (API reachable
  # about 1 time in 3, OTA stopped halfway) even at -64 dB; with them it is stable
  power_save_mode: none
  output_power: 8.5dB
  ap:
    ssid: "PlancH"
captive_portal:
improv_serial:

packages:
  core: !include core.yaml

i2c:
  sda: GPIO11
  scl: GPIO12
  frequency: 400kHz

font:
  - file: "gfonts://Roboto"
    id: font_small
    size: 10
  - file: "gfonts://Roboto@500"
    id: font_title
    size: 10

# Title on the first row, then up to 4 rows: name on the left, state on the right,
# the selected row inverted
display:
  - platform: ssd1306_i2c
    model: "SSD1306 128x64"
    address: 0x3C
    id: oled
    update_interval: 100ms
    lambda: |-
      auto &m = planch::menu();
      if (!m.screen_on()) return;
      it.print(0, 0, id(font_title), m.title().c_str());
      it.line(0, 12, 127, 12);
      auto rows = m.rows();
      for (int i = 0; i < (int) rows.size(); i++) {
        int y = 14 + i * 12;
        bool sel = i == m.selected();
        if (sel) it.filled_rectangle(0, y, 128, 12);
        auto colour = sel ? COLOR_OFF : COLOR_ON;
        it.print(2, y, id(font_small), colour, rows[i].left.c_str());
        it.print(126, y, id(font_small), colour, TextAlign::TOP_RIGHT, rows[i].right.c_str());
      }

esp32_touch:
  # ESP32-S3: with the default 8 ms the counter saturates (fixed value 4194303); ESPHome suggests 0.25 ms
  measurement_duration: 0.25ms
  sleep_duration: 0.5ms
  setup_mode: false   # true logs the raw values, to calibrate the threshold

# Keys to GND with internal pull-up; codes as planch::Key
binary_sensor:
  - platform: esp32_touch
    id: touch_key   # adopted panels change the threshold with "id: !extend touch_key"
    name: "Touch"
    pin: GPIO13
    # On the S3 the threshold is the rise over the resting value (benchmark). First board: about
    # 10500 at rest, 15000-28000 with a finger
    threshold: 2500
    on_press: [script.execute: { id: planch_key, code: 10 }]
  - platform: gpio
    name: "Up"
    pin: { number: GPIO1, inverted: true, mode: { input: true, pullup: true } }
    filters: [delayed_on: 10ms]
    on_press: [script.execute: { id: planch_key, code: 0 }]
  - platform: gpio
    name: "Down"
    pin: { number: GPIO2, inverted: true, mode: { input: true, pullup: true } }
    filters: [delayed_on: 10ms]
    on_press: [script.execute: { id: planch_key, code: 1 }]
  - platform: gpio
    name: "Left"
    pin:
      number: GPIO3        # strapping pin: used as input only
      inverted: true
      mode: { input: true, pullup: true }
      ignore_strapping_warning: true
    filters: [delayed_on: 10ms]
    on_press: [script.execute: { id: planch_key, code: 2 }]
  - platform: gpio
    name: "Right"
    pin: { number: GPIO4, inverted: true, mode: { input: true, pullup: true } }
    filters: [delayed_on: 10ms]
    on_press: [script.execute: { id: planch_key, code: 3 }]
  - platform: gpio
    name: "OK"
    pin: { number: GPIO5, inverted: true, mode: { input: true, pullup: true } }
    filters: [delayed_on: 10ms]
    on_press: [script.execute: { id: planch_key, code: 4 }]
  - platform: gpio
    name: "Back"
    pin: { number: GPIO44, inverted: true, mode: { input: true, pullup: true } }
    filters: [delayed_on: 10ms]
    on_press: [script.execute: { id: planch_key, code: 5 }]
  - platform: gpio
    name: "Scene 1"
    pin: { number: GPIO9, inverted: true, mode: { input: true, pullup: true } }
    filters: [delayed_on: 10ms]
    on_press: [script.execute: { id: planch_key, code: 6 }]
  - platform: gpio
    name: "Scene 2"
    pin: { number: GPIO8, inverted: true, mode: { input: true, pullup: true } }
    filters: [delayed_on: 10ms]
    on_press: [script.execute: { id: planch_key, code: 7 }]
  - platform: gpio
    name: "Scene 3"
    pin: { number: GPIO7, inverted: true, mode: { input: true, pullup: true } }
    filters: [delayed_on: 10ms]
    on_press: [script.execute: { id: planch_key, code: 8 }]
  - platform: gpio
    name: "Scene 4"
    pin: { number: GPIO6, inverted: true, mode: { input: true, pullup: true } }
    filters: [delayed_on: 10ms]
    on_press: [script.execute: { id: planch_key, code: 9 }]
