# PlancH - the board (Waveshare ESP32-S3-Zero): pins, display and keys.
# Not compiled on its own: planch.yaml (local files) and planch/import.yaml (from GitHub, for the
# devices adopted in the ESPHome Device Builder) add the source of the "planch" component.
# Menu built automatically by Home Assistant from the devices with the label "PlancH": logic in
# core.yaml and components/planch/menu.h, Home Assistant package in homeassistant/planch.yaml.

substitutions:
  led_pin: GPIO10

esphome:
  name: planch
  friendly_name: PlancH
  name_add_mac_suffix: true   # every panel gets its own name (planch-xxxxxx)
  project:
    name: "caccia78.planch"
    version: "1.0.0"

esp32:
  board: esp32-s3-devkitc-1
  framework:
    type: esp-idf

logger:
  hardware_uart: USB_SERIAL_JTAG   # frees TX/RX (Back button on GPIO 44)

ota:
  - platform: esphome
wifi:
  # Without these two lines the first assembled board kept dropping off the network (API reachable
  # about 1 time in 3, OTA stopped halfway) even at -64 dB; with them it is stable
  power_save_mode: none
  output_power: 8.5dB
  ap:
    ssid: "PlancH"
captive_portal:
improv_serial:

packages:
  core: !include core.yaml

i2c:
  sda: GPIO11
  scl: GPIO12
  frequency: 400kHz

font:
  - file: "gfonts://Roboto"
    id: font_row
    size: 11
  - file: "gfonts://Roboto@500"
    id: font_title
    size: 10
    glyphsets: [GF_Latin_Kernel]
    glyphs: "àèéìòù"   # Italian days of the clock (lunedì)
  # Time of the clock: digits only
  - file: "gfonts://Roboto@500"
    id: font_clock
    size: 28
    glyphs: "0123456789:-"

# Title in rows 0-15 (the yellow band of two-colour modules), then up to 4 rows of 12 px in rows
# 16-63: name on the left, state on the right, the selected row inverted. A long text is shortened
# with "…": the state takes up to half the row, the name gets the rest
display:
  - platform: ssd1306_i2c
    model: "SSD1306 128x64"
    address: 0x3C
    id: oled
    update_interval: 100ms
    lambda: |-
      // PlancH Arcade while it is open (OK and Back held for 3 s): list of games or the game
      auto &a = planch::arcade();
      if (a.active()) {
        for (int y = 0; y < 64; y++)
          for (int x = 0; x < 128; x++)
            if (a.pixel(x, y)) it.draw_pixel_at(x, y, COLOR_ON);
        return;
      }
      auto &m = planch::menu();
      if (!m.screen_on()) return;
      // Clock (Scene 4): day and date in the yellow band, the time on the left, the temperatures
      // of the room and outdoors on the right. Moved by up to 2 px every minute against burn-in
      if (m.clock_on()) {
        int dx = m.clock_minute() % 3, dy = (m.clock_minute() / 3) % 2;
        it.print(dx, 7, id(font_title), TextAlign::CENTER_LEFT, m.clock_day().c_str());
        it.print(125 + dx, 7, id(font_title), TextAlign::CENTER_RIGHT, m.clock_date().c_str());
        it.print(dx, 40 + dy, id(font_clock), TextAlign::CENTER_LEFT, m.clock_time().c_str());
        it.line(79 + dx, 20 + dy, 79 + dx, 60 + dy);
        // Right: the room (house icon) and outdoors (today's weather icon) with their temperatures,
        // today's min/max under them; without a forecast a thermometer instead of the weather icon
        auto icon = [&](const uint16_t *rows, int x0, int y0) {
          for (int y = 0; y < 15; y++)
            for (int x = 0; x < 15; x++)
              if (rows[y] & (0x4000 >> x)) it.draw_pixel_at(x0 + x, y0 + y, COLOR_ON);
        };
        icon(planch::weather_icon("home"), 82 + dx, 18 + dy);
        it.print(127, 26 + dy, id(font_title), TextAlign::CENTER_RIGHT, m.clock_in().c_str());
        const uint16_t *wx = planch::weather_icon(m.clock_condition().c_str());
        icon(wx ? wx : planch::weather_icon("thermometer"), 82 + dx, 35 + dy);
        it.print(127, 43 + dy, id(font_title), TextAlign::CENTER_RIGHT, m.clock_out_short().c_str());
        it.print(103 + dx, 58 + dy, id(font_title), TextAlign::CENTER, m.clock_minmax().c_str());
        return;
      }
      // Width of a text in pixels, and the same text shortened to w pixels with "…"
      auto width = [&](const std::string &t, display::BaseFont *f) {
        int x1, y1, w, h;
        it.get_text_bounds(0, 0, t.c_str(), f, TextAlign::TOP_LEFT, &x1, &y1, &w, &h);
        return t.empty() ? 0 : w;
      };
      auto fit = [&](std::string t, display::BaseFont *f, int w) {
        if (width(t, f) <= w) return t;
        while (!t.empty()) {
          while (!t.empty() && (t.back() & 0xC0) == 0x80) t.pop_back();   // whole UTF-8 characters
          if (!t.empty()) t.pop_back();
          while (!t.empty() && t.back() == ' ') t.pop_back();
          if (width(t + "…", f) <= w) return t + "…";
        }
        return std::string("…");
      };
      // Title, and the climate of the room on the right of it
      std::string info = m.info();
      int iw = width(info, id(font_title));
      it.print(0, 7, id(font_title), TextAlign::CENTER_LEFT,
               fit(m.title(), id(font_title), info.empty() ? 128 : 128 - iw - 4).c_str());
      if (!info.empty()) it.print(127, 7, id(font_title), TextAlign::CENTER_RIGHT, info.c_str());
      auto rows = m.rows();
      for (int i = 0; i < (int) rows.size(); i++) {
        int y = 16 + i * 12;
        bool sel = i == m.selected();
        if (sel) it.filled_rectangle(0, y, 128, 12);
        auto colour = sel ? COLOR_OFF : COLOR_ON;
        std::string right = fit(rows[i].right, id(font_row), 62);
        int rw = width(right, id(font_row));
        it.print(126, y + 6, id(font_row), colour, TextAlign::CENTER_RIGHT, right.c_str());
        it.print(2, y + 6, id(font_row), colour, TextAlign::CENTER_LEFT,
                 fit(rows[i].left, id(font_row), 126 - rw - 6).c_str());
      }

# PlancH Arcade (components/planch/arcade.h): the keys report their release too (above), the games
# run and redraw every 30 ms while the arcade is open; one best score per game in the panel's memory
globals:
  - id: arcade_best
    type: std::array<uint32_t, 8>
    restore_value: true
    initial_value: "std::array<uint32_t, 8>{}"

interval:
  # Clock at night (23-7): low contrast, against burn-in and glare in a dark room
  - interval: 1s
    then:
      - lambda: |-
          auto &m = planch::menu();
          int h = m.clock_hour();
          float c = m.clock_on() && h >= 0 && (h >= 23 || h < 7) ? 0.05f : 1.0f;
          static float last = 1.0f;
          if (c != last) {
            last = c;
            id(oled).set_contrast(c);
          }
  - interval: 30ms
    then:
      - lambda: |-
          auto &a = planch::arcade();
          static bool ready = false;
          if (!ready) {
            ready = true;
            a.enable();
            for (int i = 0; i < a.games(); i++) a.set_best(i, id(arcade_best)[i]);
          }
          if (a.loop(millis())) id(oled).update();
          for (int i = 0; i < a.games(); i++)
            if (a.best(i) != id(arcade_best)[i]) id(arcade_best)[i] = a.best(i);

esp32_touch:
  # ESP32-S3: with the default 8 ms the counter saturates (fixed value 4194303); ESPHome suggests 0.25 ms
  measurement_duration: 0.25ms
  sleep_duration: 0.5ms
  setup_mode: false   # true logs the raw values, to calibrate the threshold

# Keys to GND with internal pull-up; codes as planch::Key
binary_sensor:
  - platform: esp32_touch
    id: touch_key   # adopted panels change the threshold with "id: !extend touch_key"
    name: "Touch"
    pin: GPIO13
    # On the S3 the threshold is the rise over the resting value (benchmark). First board: about
    # 110000 at rest, jumping by up to 3800 between two levels, 210000-280000 with a finger
    threshold: 40000
    on_press: [script.execute: { id: planch_key, code: 10 }]
  - platform: gpio
    name: "Up"
    pin: { number: GPIO1, inverted: true, mode: { input: true, pullup: true } }
    filters: [delayed_on: 10ms]
    on_press: [script.execute: { id: planch_key, code: 0 }]
    on_release: [lambda: "planch::arcade().release(planch::UP, millis());"]
  - platform: gpio
    name: "Down"
    pin: { number: GPIO2, inverted: true, mode: { input: true, pullup: true } }
    filters: [delayed_on: 10ms]
    on_press: [script.execute: { id: planch_key, code: 1 }]
    on_release: [lambda: "planch::arcade().release(planch::DOWN, millis());"]
  - platform: gpio
    name: "Left"
    pin:
      number: GPIO3        # strapping pin: used as input only
      inverted: true
      mode: { input: true, pullup: true }
      ignore_strapping_warning: true
    filters: [delayed_on: 10ms]
    on_press: [script.execute: { id: planch_key, code: 2 }]
    on_release: [lambda: "planch::arcade().release(planch::LEFT, millis());"]
  - platform: gpio
    name: "Right"
    pin: { number: GPIO4, inverted: true, mode: { input: true, pullup: true } }
    filters: [delayed_on: 10ms]
    on_press: [script.execute: { id: planch_key, code: 3 }]
    on_release: [lambda: "planch::arcade().release(planch::RIGHT, millis());"]
  - platform: gpio
    name: "OK"
    pin: { number: GPIO5, inverted: true, mode: { input: true, pullup: true } }
    filters: [delayed_on: 10ms]
    on_press: [script.execute: { id: planch_key, code: 4 }]
    on_release: [lambda: "planch::arcade().release(planch::OK, millis());"]
  - platform: gpio
    name: "Back"
    pin: { number: GPIO44, inverted: true, mode: { input: true, pullup: true } }
    filters: [delayed_on: 10ms]
    on_press: [script.execute: { id: planch_key, code: 5 }]
    on_release: [lambda: "planch::arcade().release(planch::BACK, millis());"]
  - platform: gpio
    name: "Scene 1"
    pin: { number: GPIO9, inverted: true, mode: { input: true, pullup: true } }
    filters: [delayed_on: 10ms]
    on_press: [script.execute: { id: planch_key, code: 6 }]
    on_release: [lambda: "planch::arcade().release(planch::S1, millis());"]
  - platform: gpio
    name: "Scene 2"
    pin: { number: GPIO8, inverted: true, mode: { input: true, pullup: true } }
    filters: [delayed_on: 10ms]
    on_press: [script.execute: { id: planch_key, code: 7 }]
    on_release: [lambda: "planch::arcade().release(planch::S2, millis());"]
  - platform: gpio
    name: "Scene 3"
    pin: { number: GPIO7, inverted: true, mode: { input: true, pullup: true } }
    filters: [delayed_on: 10ms]
    on_press: [script.execute: { id: planch_key, code: 8 }]
    on_release: [lambda: "planch::arcade().release(planch::S3, millis());"]
  - platform: gpio
    name: "Scene 4"
    pin: { number: GPIO6, inverted: true, mode: { input: true, pullup: true } }
    filters: [delayed_on: 10ms]
    on_press: [script.execute: { id: planch_key, code: 9 }]
    on_release: [lambda: "planch::arcade().release(planch::S4, millis());"]
