# PlancH - firmware core (package planch/core.yaml), shared by the real board (planch.yaml) and the test bench (planch-test.yaml).
# The board files define the keys (they call the script planch_key) and the screen; this package
# reads the menu from Home Assistant, performs the actions and drives the 13 LEDs.
#
# Home Assistant side: package homeassistant/planch.yaml (sensor.planch_menu). In the ESPHome
# integration options enable "Allow the device to perform Home Assistant actions".
#
# Substitutions required: led_pin (data line of the LED chain).

esphome:
  includes:
    - planch/menu.h
  on_boot:
    priority: -100
    then:
      - light.turn_on:
          id: led_chain
          brightness: 100%
          effect: PlancH

json:

# Name of the panel, set from its device page in Home Assistant (for example Studio): it shows the
# devices with the labels "PlancH" and "PlancH Studio". Kept in the panel's memory.
text:
  - platform: template
    id: panel_name
    name: "Panel"
    icon: mdi:label-outline
    entity_category: config
    mode: text
    max_length: 24
    optimistic: true
    restore_value: true
    initial_value: ""
    on_value:
      - lambda: |-
          planch::menu().set_panel(x);
          planch::menu().set_menus(id(ha_menu).state);   // menus already received: pick again
          planch::menu().set_scenes(id(ha_scenes).state);

api:
  on_client_connected:
    - lambda: planch::menu().set_connected(true);
  on_client_disconnected:
    - lambda: planch::menu().set_connected(false);

text_sensor:
  # Menus built by Home Assistant, one per panel: rooms, types, devices with their state (JSON);
  # the panel keeps only its own (field "Panel")
  - platform: homeassistant
    id: ha_menu
    entity_id: sensor.planch_menu
    attribute: menus
    internal: true
    on_value:
      - lambda: planch::menu().set_menus(x);
  # Colours of the Colour row of a light (palette defined in the package)
  - platform: homeassistant
    id: ha_palette
    entity_id: sensor.planch_menu
    attribute: palette
    internal: true
    on_value:
      - lambda: planch::menu().set_palette(x);
  # Entities assigned to the scene keys (labels "PlancH S1" ... and "PlancH <panel> S1" ...)
  - platform: homeassistant
    id: ha_scenes
    entity_id: sensor.planch_menu
    attribute: scenes
    internal: true
    on_value:
      - lambda: planch::menu().set_scenes(x);

script:
  # Key pressed: code = planch::Key (UP, DOWN, LEFT, RIGHT, OK, BACK, S1..S4, TOUCH).
  # Each Home Assistant action goes to the script for its extra field (the data keys of an action
  # cannot be computed); every script reports the outcome to the model: scene LED green or red,
  # D1 red for a menu action that failed.
  - id: planch_key
    mode: queued
    max_runs: 10
    parameters:
      code: int
    then:
      - lambda: |-
          for (auto &c : planch::menu().key(static_cast<planch::Key>(code), millis())) {
            ESP_LOGI("planch", "%s %s %s %s", c.action.c_str(), c.entity.c_str(), c.field.c_str(), c.value.c_str());
            if (c.field == "brightness_step_pct") id(planch_call_brightness)->execute(c.action, c.entity, c.value, c.scene);
            else if (c.field == "temperature") id(planch_call_temperature)->execute(c.action, c.entity, c.value, c.scene);
            else if (c.field == "color_temp_kelvin") id(planch_call_kelvin)->execute(c.action, c.entity, c.value, c.scene);
            else if (c.field == "hs_color") id(planch_call_hs)->execute(c.action, c.entity, c.value, c.scene);
            else if (c.field == "effect_step") id(planch_call_effect)->execute(c.action, c.entity, c.value, c.scene);
            else id(planch_call)->execute(c.action, c.entity, c.value, c.scene);
          }

  # Only entity_id
  - id: planch_call
    mode: queued
    max_runs: 10
    parameters:
      action_name: string
      entity: string
      value: string
      scene: int
    then:
      - homeassistant.action:
          action: !lambda return action_name;
          data:
            entity_id: !lambda return entity;
          on_success:
            - lambda: planch::menu().result(scene, true, millis());
          on_error:
            - lambda: |-
                ESP_LOGW("planch", "%s %s: %s", action_name.c_str(), entity.c_str(), error.c_str());
                planch::menu().result(scene, false, millis());

  # Light brightness, value = step in % ("10", "-10")
  - id: planch_call_brightness
    mode: queued
    max_runs: 10
    parameters:
      action_name: string
      entity: string
      value: string
      scene: int
    then:
      - homeassistant.action:
          action: !lambda return action_name;
          data:
            entity_id: !lambda return entity;
            brightness_step_pct: !lambda return value;
          on_success:
            - lambda: planch::menu().result(scene, true, millis());
          on_error:
            - lambda: |-
                ESP_LOGW("planch", "%s %s: %s", action_name.c_str(), entity.c_str(), error.c_str());
                planch::menu().result(scene, false, millis());

  # Thermostat target temperature
  - id: planch_call_temperature
    mode: queued
    max_runs: 10
    parameters:
      action_name: string
      entity: string
      value: string
      scene: int
    then:
      - homeassistant.action:
          action: !lambda return action_name;
          data:
            entity_id: !lambda return entity;
            temperature: !lambda return value;
          on_success:
            - lambda: planch::menu().result(scene, true, millis());
          on_error:
            - lambda: |-
                ESP_LOGW("planch", "%s %s: %s", action_name.c_str(), entity.c_str(), error.c_str());
                planch::menu().result(scene, false, millis());

  # Light white temperature in kelvin
  - id: planch_call_kelvin
    mode: queued
    max_runs: 10
    parameters:
      action_name: string
      entity: string
      value: string
      scene: int
    then:
      - homeassistant.action:
          action: !lambda return action_name;
          data:
            entity_id: !lambda return entity;
            color_temp_kelvin: !lambda return value;
          on_success:
            - lambda: planch::menu().result(scene, true, millis());
          on_error:
            - lambda: |-
                ESP_LOGW("planch", "%s %s: %s", action_name.c_str(), entity.c_str(), error.c_str());
                planch::menu().result(scene, false, millis());

  # Light colour from the palette, value = "hue,saturation" (a list for HA)
  - id: planch_call_hs
    mode: queued
    max_runs: 10
    parameters:
      action_name: string
      entity: string
      value: string
      scene: int
    then:
      - homeassistant.action:
          action: !lambda return action_name;
          data:
            entity_id: !lambda return entity;
          data_template:
            hs_color: "{{ [h | float, s | float] }}"
          variables:
            h: !lambda return value.substr(0, value.find(','));
            s: !lambda return value.substr(value.find(',') + 1);
          on_success:
            - lambda: planch::menu().result(scene, true, millis());
          on_error:
            - lambda: |-
                ESP_LOGW("planch", "%s %s: %s", action_name.c_str(), entity.c_str(), error.c_str());
                planch::menu().result(scene, false, millis());

  # Next or previous effect of the light, value = "1" or "-1": HA reads the list
  - id: planch_call_effect
    mode: queued
    max_runs: 10
    parameters:
      action_name: string
      entity: string
      value: string
      scene: int
    then:
      - homeassistant.action:
          action: !lambda return action_name;
          data:
            entity_id: !lambda return entity;
          data_template:
            effect: >-
              {% set l = state_attr(light, 'effect_list') or [] %}{% set c = state_attr(light, 'effect') %}
              {{ l[((l.index(c) if c in l else -1) + step | int) % (l | count)] if l else '' }}
          variables:
            light: !lambda return entity;
            step: !lambda return value;
          on_success:
            - lambda: planch::menu().result(scene, true, millis());
          on_error:
            - lambda: |-
                ESP_LOGW("planch", "%s %s: %s", action_name.c_str(), entity.c_str(), error.c_str());
                planch::menu().result(scene, false, millis());

interval:
  - interval: 1s
    then:
      - lambda: planch::menu().tick(millis());

# Backlight D8-D13 and status LEDs D2, D3: RGB lights in Home Assistant whose channels feed the
# LED effect
output:
  - platform: template
    id: backlight_r
    type: float
    write_action:
      - lambda: planch::menu().set_backlight(0, state);
  - platform: template
    id: backlight_g
    type: float
    write_action:
      - lambda: planch::menu().set_backlight(1, state);
  - platform: template
    id: backlight_b
    type: float
    write_action:
      - lambda: planch::menu().set_backlight(2, state);

  - platform: template
    id: status2_r
    type: float
    write_action:
      - lambda: planch::menu().set_status(0, 0, state);
  - platform: template
    id: status2_g
    type: float
    write_action:
      - lambda: planch::menu().set_status(0, 1, state);
  - platform: template
    id: status2_b
    type: float
    write_action:
      - lambda: planch::menu().set_status(0, 2, state);
  - platform: template
    id: status3_r
    type: float
    write_action:
      - lambda: planch::menu().set_status(1, 0, state);
  - platform: template
    id: status3_g
    type: float
    write_action:
      - lambda: planch::menu().set_status(1, 1, state);
  - platform: template
    id: status3_b
    type: float
    write_action:
      - lambda: planch::menu().set_status(1, 2, state);

light:
  - platform: rgb
    name: "Backlight"
    red: backlight_r
    green: backlight_g
    blue: backlight_b
  - platform: rgb
    name: "Status LED 2"
    red: status2_r
    green: status2_g
    blue: status2_b
  - platform: rgb
    name: "Status LED 3"
    red: status3_r
    green: status3_g
    blue: status3_b
  # The 13 LEDs: colours computed by planch::Menu (status, scene keys, backlight)
  - platform: esp32_rmt_led_strip
    id: led_chain
    pin: ${led_pin}
    num_leds: 13
    chipset: SK6812
    channel_colors: GRB
    internal: true
    color_correct: [40%, 40%, 40%]   # limits total current
    effects:
      - addressable_lambda:
          name: PlancH
          update_interval: 40ms
          lambda: |-
            planch::Rgb c[planch::Menu::LEDS];
            planch::menu().leds(c, millis());
            for (int i = 0; i < planch::Menu::LEDS && i < it.size(); i++) it[i] = Color(c[i].r, c[i].g, c[i].b);
