# PlancH - ESPHome firmware for the board (Waveshare ESP32-S3-Zero), from the local files.
# Menu built automatically by Home Assistant from the devices with the label "PlancH": board in
# planch/board.yaml, logic in planch/core.yaml and components/planch/, Home Assistant package in
# homeassistant/planch.yaml.
# Wi-Fi is set after flashing: from web.esphome.io ("Configure Wi-Fi", Improv serial) or from the
# "PlancH" hotspot that the board opens while it has no network.

packages:
  board: !include planch/board.yaml

external_components:
  - source: components
    components: [planch]

# Once in Home Assistant the panel can be adopted in the ESPHome Device Builder: its configuration
# then imports planch/import.yaml from GitHub, so it needs no copy of these files
dashboard_import:
  package_import_url: github://caccia78/PlancH/firmware/planch/import.yaml@main
