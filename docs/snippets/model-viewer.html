<!-- model-viewer as an ES module sharing three.js with model-viewer-effects 1.5.0: effects needs
     LuminanceFormat (gone from three 0.177), model-viewer 4.1.0 is the release built on three 0.172 -->
<script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.172.0/build/three.module.min.js"
    }
  }
</script>
<script type="module" src="https://cdn.jsdelivr.net/npm/@google/model-viewer@4.1.0/dist/model-viewer-module.min.js"></script>
<!-- Buttons with data-viewer-background="<model-viewer id>" switch that viewer to a dark background -->
<script>
  document.addEventListener("click", (event) => {
    const button = event.target.closest("button[data-viewer-background]");
    if (!button) return;
    const dark = button.getAttribute("aria-pressed") !== "true";
    document.getElementById(button.dataset.viewerBackground).style.backgroundColor = dark ? "#101114" : "";
    button.setAttribute("aria-pressed", String(dark));
    button.classList.toggle("md-button--primary", dark);
  });
</script>
